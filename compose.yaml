services:
  delivery_service_postgres:
    image: postgres:18.6-alpine3.24
    container_name: delivery_service_postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  delivery_service_redis:
    image: redis:alpine3.22
    container_name: delivery_service_redis
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  delivery_service_rustfs:
    image: rustfs/rustfs:1.0.3
    container_name: delivery_service_rustfs
    environment:
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
    volumes:
      - rustfs_data:/data
    ports:
      - "${RUSTFS_PORT}:9000"
      - "${RUSTFS_WEB_PORT}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  delivery_service_mailpit:
    image: axllent/mailpit:v1.31.6
    container_name: delivery_service_mailpit
    environment:
      - MP_MAX_MESSAGES=5000
      - MP_IP=0.0.0.0
    ports:
      - "${MAIL_PIT_SMTP_PORT}:1025"
      - "${MAIL_PIT_WEB_PORT}:8025"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8025/api/v1/info"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rustfs_data:
